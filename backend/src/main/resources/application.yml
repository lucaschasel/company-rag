server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/knowledge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD:}
  storage: ${STORAGE_PATH:./data/uploads}
  storage-type: ${STORAGE_TYPE:local}
  chunk:
    max-tokens: ${CHUNK_MAX_TOKENS:512}
    overlap-tokens: ${CHUNK_OVERLAP_TOKENS:64}
  ingestion:
    lease-seconds: ${INGESTION_LEASE_SECONDS:300}
  ocr:
    enabled: ${OCR_ENABLED:false}
    all-pages: ${OCR_ALL_PAGES:false}
    min-text-chars: ${OCR_MIN_TEXT_CHARS:20}
    timeout-seconds: ${OCR_TIMEOUT_SECONDS:60}
    executable: ${OCR_EXECUTABLE:tesseract}
    languages: ${OCR_LANGUAGES:chi_sim+eng}
    command: ${OCR_COMMAND:}
  clamd:
    host: ${CLAMD_HOST:}
    port: ${CLAMD_PORT:3310}
    timeout-ms: ${CLAMD_TIMEOUT_MS:15000}
  s3:
    path-style: ${S3_PATH_STYLE:true}
    bucket: ${S3_BUCKET:}
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  model:
    enabled: ${MODEL_ENABLED:false}
    base-url: ${MODEL_BASE_URL:http://localhost:11434/v1}
    api-key: ${MODEL_API_KEY:ollama}
    chat-model: ${CHAT_MODEL:qwen2.5:7b}
    embedding-model: ${EMBEDDING_MODEL:nomic-embed-text}
    embedding-version: ${EMBEDDING_VERSION:v1}
---
spring:
  config:
    activate:
      on-profile: postgres
  flyway:
    locations: classpath:db/migration,classpath:db/postgres
server:
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}
---
spring:
  config:
    activate:
      on-profile: redis
  session:
    store-type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
