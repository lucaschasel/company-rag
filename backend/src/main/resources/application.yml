server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/knowledge;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  admin-user: ${ADMIN_USER:admin}
  admin-password: ${ADMIN_PASSWORD:}
  storage: ${STORAGE_PATH:./data/uploads}
  model:
    enabled: ${MODEL_ENABLED:false}
    base-url: ${MODEL_BASE_URL:http://localhost:11434/v1}
    api-key: ${MODEL_API_KEY:ollama}
    chat-model: ${CHAT_MODEL:qwen2.5:7b}
    embedding-model: ${EMBEDDING_MODEL:nomic-embed-text}
    embedding-version: ${EMBEDDING_VERSION:v1}
---
spring:
  config:
    activate:
      on-profile: postgres
  flyway:
    locations: classpath:db/migration,classpath:db/postgres
server:
  servlet:
    session:
      cookie:
        secure: ${COOKIE_SECURE:true}
