services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres,redis
      DB_URL: jdbc:postgresql://postgres:5432/knowledge
      DB_USER: knowledge
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      CHUNK_MAX_TOKENS: ${CHUNK_MAX_TOKENS:-512}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-64}
      INGESTION_LEASE_SECONDS: ${INGESTION_LEASE_SECONDS:-300}
      OCR_COMMAND: ${OCR_COMMAND:-}
      CLAMD_HOST: ${CLAMD_HOST:-}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MODEL_ENABLED: ${MODEL_ENABLED:-false}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-ollama}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:7b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-v1}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
  uploads:
